name: Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hospital-app
  S3_BUCKET: hospital-app-artifacts-028282962975
  EC2_INSTANCE_ID: i-0fb5f0c5bd05bcdc9
  CONTAINER_NAME: hospital-app
  APP_PORT: 3000

jobs:

  # ==========================================================
  # JOB 1 - CI: BUILD APPLICATION
  # ==========================================================

  ci:
    name: CI - Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-build
          path: dist/


  # ==========================================================
  # JOB 2 - DOCKER BUILD + ECR PUSH + S3 UPLOAD
  # ==========================================================

  build-and-push:
    name: Docker Build, ECR Push and S3 Upload
    runs-on: ubuntu-latest

    needs: ci

    # Only deploy after push to main.
    # Pull requests only run CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Download CI Build Artifact
      # --------------------------------------------------------

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-build
          path: dist/


      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "=========================================="
          echo "Building Docker Image"
          echo "=========================================="
          echo "$IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Push Docker Image to ECR
      # --------------------------------------------------------

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "=========================================="
          echo "Pushing Docker Image to ECR"
          echo "=========================================="

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # --------------------------------------------------------
      # Upload Versioned Build to S3
      # --------------------------------------------------------

      - name: Upload Versioned Build to S3
        run: |

          echo "=========================================="
          echo "Uploading Versioned Build to S3"
          echo "=========================================="

          aws s3 sync dist/ \
            "s3://${S3_BUCKET}/builds/${GITHUB_SHA}/" \
            --delete


      # --------------------------------------------------------
      # Update Latest Build in S3
      # --------------------------------------------------------

      - name: Update Latest Build in S3
        run: |

          echo "=========================================="
          echo "Updating Latest Build in S3"
          echo "=========================================="

          aws s3 sync dist/ \
            "s3://${S3_BUCKET}/latest/" \
            --delete


      # --------------------------------------------------------
      # Build and Push Summary
      # --------------------------------------------------------

      - name: Build and Push Summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "=========================================="
          echo "Build and Push Completed"
          echo "=========================================="

          echo "Docker Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo ""
          echo "S3 Bucket:"
          echo "$S3_BUCKET"

          echo ""
          echo "Build completed successfully."


  # ==========================================================
  # JOB 3 - DEPLOY DOCKER CONTAINER TO EC2 USING SSM
  # ==========================================================

  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify EC2 SSM Status
      # --------------------------------------------------------

      - name: Verify EC2 SSM Status
        run: |

          echo "=========================================="
          echo "Checking EC2 SSM Status"
          echo "=========================================="

          aws ssm describe-instance-information \
            --region "$AWS_REGION"

          echo ""
          echo "Checking target EC2 instance..."

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --region "$AWS_REGION"


      # --------------------------------------------------------
      # Send Deployment Command to EC2
      # --------------------------------------------------------

      - name: Deploy Docker Container to EC2
        id: deploy
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image }}

        run: |

          echo "=========================================="
          echo "Starting EC2 Deployment"
          echo "=========================================="

          echo "EC2 Instance:"
          echo "$EC2_INSTANCE_ID"

          echo ""
          echo "Docker Image:"
          echo "$IMAGE_URI"


          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hospital Application" \
            --parameters "commands=[
              \"set -e\",
              \"echo Starting deployment\",
              \"echo Logging into Amazon ECR\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin 028282962975.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"echo ECR login successful\",
              \"echo Pulling Docker image\",
              \"sudo docker pull $IMAGE_URI\",
              \"echo Docker image pulled successfully\",
              \"echo Stopping old container\",
              \"sudo docker stop $CONTAINER_NAME || true\",
              \"echo Removing old container\",
              \"sudo docker rm $CONTAINER_NAME || true\",
              \"echo Starting new container\",
              \"sudo docker run -d --name $CONTAINER_NAME --restart unless-stopped -p $APP_PORT:$APP_PORT $IMAGE_URI\",
              \"echo Checking running containers\",
              \"sudo docker ps --filter name=$CONTAINER_NAME\",
              \"echo Checking container logs\",
              \"sudo docker logs --tail 50 $CONTAINER_NAME\",
              \"echo Deployment completed successfully\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo ""
          echo "SSM Command ID:"
          echo "$COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Wait for Deployment
      # --------------------------------------------------------

      - name: Wait for EC2 Deployment
        run: |

          echo "=========================================="
          echo "Waiting for EC2 Deployment"
          echo "=========================================="

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          echo ""
          echo "SSM command finished processing."


      # --------------------------------------------------------
      # Get Deployment Status and Logs
      # --------------------------------------------------------

      - name: Verify EC2 Deployment
        run: |

          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="


          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)


          echo ""
          echo "SSM Status:"
          echo "$STATUS"


          echo ""
          echo "=========================================="
          echo "STANDARD OUTPUT"
          echo "=========================================="


          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text


          echo ""
          echo "=========================================="
          echo "ERROR OUTPUT"
          echo "=========================================="


          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text


          if [ "$STATUS" != "Success" ]; then

            echo ""
            echo "=========================================="
            echo "DEPLOYMENT FAILED"
            echo "=========================================="

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="


      # --------------------------------------------------------
      # Application Deployment Information
      # --------------------------------------------------------

      - name: Application Deployment Information
        run: |

          echo "=========================================="
          echo "Application Deployment Completed"
          echo "=========================================="

          echo ""
          echo "EC2 Instance:"
          echo "$EC2_INSTANCE_ID"

          echo ""
          echo "Application Port:"
          echo "$APP_PORT"

          echo ""
          echo "Application URL:"
          echo "http://52.66.213.169:3000"

          echo ""
          echo "Docker Container:"
          echo "$CONTAINER_NAME"

          echo ""
          echo "Deployment completed successfully."


  # ==========================================================
  # JOB 4 - PIPELINE SUMMARY
  # ==========================================================

  summary:
    name: CI/CD Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - ci
      - build-and-push
      - deploy

    if: always()

    steps:

      - name: Show Pipeline Summary
        run: |

          echo "=========================================="
          echo "Hospital CI/CD Pipeline Summary"
          echo "=========================================="

          echo ""
          echo "CI Status:"
          echo "${{ needs.ci.result }}"

          echo ""
          echo "Docker / ECR / S3 Status:"
          echo "${{ needs.build-and-push.result }}"

          echo ""
          echo "EC2 Deployment Status:"
          echo "${{ needs.deploy.result }}"

          echo ""
          echo "Docker Image:"
          echo "${{ needs.build-and-push.outputs.image }}"

          echo ""
          echo "S3 Bucket:"
          echo "$S3_BUCKET"

          echo ""
          echo "EC2 Instance:"
          echo "$EC2_INSTANCE_ID"

          echo ""
          echo "Application:"
          echo "http://52.66.213.169:3000"

          echo ""
          echo "=========================================="
