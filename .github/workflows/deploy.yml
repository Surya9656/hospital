name: Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hospital-app
  S3_BUCKET: hospital-app-artifacts

jobs:

  # ==========================================================
  # 1. CI - Build Application
  # ==========================================================

  ci:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      # Upload build output as GitHub Actions artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-build
          path: dist/


  # ==========================================================
  # 2. Docker Build + ECR Push + S3 Upload
  # ==========================================================

  deploy:
    name: Docker Build, ECR Push and S3 Upload
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Download CI Build Artifact
      # --------------------------------------------------------

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-build
          path: dist/


      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .


      # --------------------------------------------------------
      # Push Docker Image to ECR
      # --------------------------------------------------------

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # --------------------------------------------------------
      # Upload Build to S3
      # --------------------------------------------------------

      - name: Upload Build to S3
        run: |
          aws s3 sync dist/ \
            s3://${{ env.S3_BUCKET }}/builds/${{ github.sha }}/ \
            --delete


      # --------------------------------------------------------
      # Upload Latest Build to S3
      # --------------------------------------------------------

      - name: Update Latest S3 Build
        run: |
          aws s3 sync dist/ \
            s3://${{ env.S3_BUCKET }}/latest/ \
            --delete


      # --------------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------------

      - name: Deployment Summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "=========================================="
          echo "Hospital CI/CD Pipeline Completed"
          echo "=========================================="
          echo ""
          echo "Docker Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo ""
          echo "ECR:"
          echo "Docker image pushed successfully"
          echo ""
          echo "S3:"
          echo "Build uploaded successfully"
          echo ""
          echo "CloudWatch:"
          echo "GitHub Actions workflow logs available"
          echo "=========================================="
