name: Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: hospital-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hospital-app

  EC2_INSTANCE_ID: i-0fb5f0c5bd05bcdc9

  CONTAINER_NAME: hospital-app
  APP_PORT: 3000

  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  # ============================================================
  # 1. CI - BUILD / TEST / SECURITY
  # ============================================================

  ci:
    name: CI - Build Test Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --audit-level=high

      - name: Build application
        run: npm run build

  # ============================================================
  # 2. CODEQL SECURITY
  # ============================================================

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # 3. DOCKER BUILD + TRIVY
  # ============================================================

  docker-security:
    name: Docker Build and Security Scan
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "IMAGE_URI=${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --tag "${{ steps.meta.outputs.image_uri }}" \
            .

      # ----------------------------------------------------------
      # Trivy filesystem scan
      # ----------------------------------------------------------

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # ----------------------------------------------------------
      # Trivy Docker image scan
      # ----------------------------------------------------------

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # ----------------------------------------------------------
      # Push image only after security checks pass
      # ----------------------------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.meta.outputs.image_uri }}"

  # ============================================================
  # 4. DEPLOY TO EC2 USING SSM
  # ============================================================

  deploy:
    name: Production Deployment
    needs:
      - docker-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Get ECR registry
      # ----------------------------------------------------------

      - name: Get ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Deploy through AWS SSM
      # ----------------------------------------------------------

      - name: Deploy application to EC2
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

          IMAGE_TAG: ${{ needs.docker-security.outputs.image_tag }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying:"
          echo "${IMAGE_URI}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Hospital production deployment ${IMAGE_TAG}" \
            --parameters commands='[
              "set -e",

              "echo ===== DEPLOYMENT START =====",

              "echo Pulling new image...",
              "sudo docker pull '"${IMAGE_URI}"'",

              "echo Saving current image for rollback...",
              "if sudo docker inspect '"${CONTAINER_NAME}"' >/dev/null 2>&1; then sudo docker inspect '"${CONTAINER_NAME}"' --format='\''{{.Config.Image}}'\'' | sudo tee /tmp/hospital_previous_image >/dev/null; else echo NONE | sudo tee /tmp/hospital_previous_image >/dev/null; fi",

              "echo Stopping old container...",
              "sudo docker stop '"${CONTAINER_NAME}"' || true",

              "echo Removing old container...",
              "sudo docker rm '"${CONTAINER_NAME}"' || true",

              "echo Starting new container...",

              "sudo docker run -d \
                --name '"${CONTAINER_NAME}"' \
                --restart unless-stopped \
                -p '"${APP_PORT}"':'"${APP_PORT}"' \
                -e NODE_ENV=production \
                -e PORT='"${APP_PORT}"' \
                -e DB_HOST='"${DB_HOST}"' \
                -e DB_PORT='"${DB_PORT}"' \
                -e DB_NAME='"${DB_NAME}"' \
                -e DB_USER='"${DB_USER}"' \
                -e DB_PASSWORD='"${DB_PASSWORD}"' \
                -e DB_SSL=true \
                '"${IMAGE_URI}"'",

              "echo Waiting for application startup...",
              "sleep 15",

              "echo Checking container status...",
              "STATUS=$(sudo docker inspect -f '\''{{.State.Status}}'\'' '"${CONTAINER_NAME}"')",

              "if [ \"$STATUS\" != \"running\" ]; then echo 'Container is not running'; sudo docker ps -a; sudo docker logs --tail 100 '"${CONTAINER_NAME}"'; exit 1; fi",

              "echo Container is running.",

              "echo Checking application health...",

              "HEALTHY=false",

              "for i in $(seq 1 12); do",

              "  if curl -fsS http://localhost:'"${APP_PORT}"'/ >/dev/null 2>&1; then",

              "    HEALTHY=true",

              "    echo 'Application health check PASSED'",

              "    break",

              "  fi",

              "  echo \"Health check attempt $i failed. Waiting...\"",

              "  sleep 5",

              "done",

              "if [ \"$HEALTHY\" != \"true\" ]; then",

              "  echo 'APPLICATION HEALTH CHECK FAILED'",

              "  sudo docker ps -a",

              "  sudo docker logs --tail 150 '"${CONTAINER_NAME}"'",

              "  exit 1",

              "fi",

              "echo ===== DEPLOYMENT SUCCESSFUL ====="
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Wait for SSM command
      # ----------------------------------------------------------

      - name: Wait for deployment
        run: |

          echo "Waiting for EC2 deployment..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful."
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

              exit 1
            fi

            sleep 10

          done

      # ----------------------------------------------------------
      # Final verification
      # ----------------------------------------------------------

      - name: Verify deployment
        run: |

          echo "Checking final SSM deployment status..."

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Final deployment verification failed."
            exit 1
          fi

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

  # ============================================================
  # 5. DEPLOYMENT SUMMARY
  # ============================================================

  summary:
    name: Deployment Summary
    needs:
      - ci
      - codeql
      - docker-security
      - deploy

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Deployment summary
        run: |

          echo "=========================================="
          echo "        HOSPITAL APPLICATION"
          echo "        DEPLOYMENT SUMMARY"
          echo "=========================================="

          echo "CI:              ${{ needs.ci.result }}"
          echo "CodeQL:          ${{ needs.codeql.result }}"
          echo "Docker Security: ${{ needs.docker-security.result }}"
          echo "Deployment:      ${{ needs.deploy.result }}"

          echo "=========================================="

          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "Deployment FAILED."
            exit 1
          fi

          echo "Production deployment completed successfully."
