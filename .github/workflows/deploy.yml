name: Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hospital-app
  S3_BUCKET: hospital-app-artifacts-028282962975
  EC2_INSTANCE_ID: i-0fb5f0c5bd05bcdc9
  CONTAINER_NAME: hospital-app
  APP_PORT: 3000

jobs:

  # ==========================================================
  # JOB 1: CI - Build and Validate Application
  # ==========================================================

  ci:
    name: CI - Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-build
          path: dist/


  # ==========================================================
  # JOB 2: Docker Build + ECR + S3
  # ==========================================================

  build-and-push:
    name: Docker Build and Push to ECR
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    outputs:
      image:
        value: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Building Docker Image:"
          echo "$IMAGE_URI"

          docker build \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Push Docker Image to ECR
      # --------------------------------------------------------

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # --------------------------------------------------------
      # Upload Build Files to S3
      # --------------------------------------------------------

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-build
          path: dist/


      - name: Upload Build to S3
        run: |

          aws s3 sync dist/ \
            s3://${{ env.S3_BUCKET }}/builds/${{ github.sha }}/ \
            --delete


      - name: Update Latest Build in S3
        run: |

          aws s3 sync dist/ \
            s3://${{ env.S3_BUCKET }}/latest/ \
            --delete


  # ==========================================================
  # JOB 3: Deploy Docker Container to EC2
  # ==========================================================

  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Deploy to EC2 using AWS Systems Manager
      # --------------------------------------------------------

      - name: Deploy Docker Container to EC2
        id: deploy
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image }}

        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hospital Application" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin 028282962975.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com\",
              \"docker pull $IMAGE_URI\",
              \"docker stop ${{ env.CONTAINER_NAME }} || true\",
              \"docker rm ${{ env.CONTAINER_NAME }} || true\",
              \"docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} $IMAGE_URI\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Wait for Deployment
      # --------------------------------------------------------

      - name: Wait for EC2 Deployment
        run: |

          sleep 10

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"


      # --------------------------------------------------------
      # Deployment Verification
      # --------------------------------------------------------

      - name: Verify Deployment
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed"
            exit 1
          fi

          echo "Deployment successful"


  # ==========================================================
  # JOB 4: Deployment Summary
  # ==========================================================

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest

    needs:
      - ci
      - build-and-push
      - deploy

    if: always()

    steps:

      - name: Show Deployment Summary
        run: |

          echo "=========================================="
          echo "Hospital CI/CD Pipeline"
          echo "=========================================="
          echo ""
          echo "CI Status:"
          echo "${{ needs.ci.result }}"
          echo ""
          echo "Docker / ECR Status:"
          echo "${{ needs.build-and-push.result }}"
          echo ""
          echo "EC2 Deployment Status:"
          echo "${{ needs.deploy.result }}"
          echo ""
          echo "ECR Image:"
          echo "${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "S3 Bucket:"
          echo "${{ env.S3_BUCKET }}"
          echo ""
          echo "CloudWatch:"
          echo "Application logs should be collected from EC2"
          echo "=========================================="
