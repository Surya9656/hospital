name: Hospital CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default permission
permissions:
  contents: read

# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hospital-app
  S3_BUCKET: hospital-app-artifacts-028282962975

  # EC2 Instance
  EC2_INSTANCE_ID: i-0fb5f0c5bd05bcdc9

  # Docker
  CONTAINER_NAME: hospital-app
  APP_PORT: 3000


jobs:

  # ==========================================================
  # JOB 1
  # CI - INSTALL, BUILD AND VALIDATE
  # ==========================================================

  ci:

    name: CI - Build Application

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install Dependencies
        run: npm ci


      # --------------------------------------------------------
      # Build application
      # --------------------------------------------------------

      - name: Build Application
        run: npm run build


      # --------------------------------------------------------
      # Upload build artifact
      # --------------------------------------------------------

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-build
          path: dist/


  # ==========================================================
  # JOB 2
  # DOCKER BUILD + ECR PUSH + S3 UPLOAD
  # ==========================================================

  build-and-push:

    name: Docker Build, ECR Push and S3 Upload

    runs-on: ubuntu-latest

    needs: ci

    # Run only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Download CI build artifact
      # --------------------------------------------------------

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-build
          path: dist/


      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        id: image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "=========================================="
          echo "Building Docker Image"
          echo "=========================================="
          echo "$IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Push commit-specific Docker image
      # --------------------------------------------------------

      - name: Push Docker Image - Commit Tag

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # --------------------------------------------------------
      # Push latest Docker image
      # --------------------------------------------------------

      - name: Push Docker Image - Latest

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


      # --------------------------------------------------------
      # Upload build to S3
      # --------------------------------------------------------

      - name: Upload Build to S3

        run: |

          echo "Uploading build to S3..."

          aws s3 sync \
            dist/ \
            "s3://${S3_BUCKET}/builds/${{ github.sha }}/" \
            --delete


      # --------------------------------------------------------
      # Update latest build in S3
      # --------------------------------------------------------

      - name: Update Latest Build in S3

        run: |

          echo "Updating latest build..."

          aws s3 sync \
            dist/ \
            "s3://${S3_BUCKET}/latest/" \
            --delete


      # --------------------------------------------------------
      # Build and Push Summary
      # --------------------------------------------------------

      - name: Build and Push Summary

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "=========================================="
          echo "Build and Push Completed"
          echo "=========================================="
          echo ""
          echo "ECR Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo ""
          echo "ECR Latest:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo ""
          echo "S3 Bucket:"
          echo "$S3_BUCKET"
          echo ""
          echo "Build uploaded successfully"
          echo "=========================================="


  # ==========================================================
  # JOB 3
  # DEPLOY DOCKER CONTAINER TO EC2
  # USING AWS SYSTEMS MANAGER
  # ==========================================================

  deploy:

    name: Deploy Application to EC2

    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Deploy Docker Container
      # --------------------------------------------------------

      - name: Deploy Docker Container to EC2

        id: deploy

        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image }}

        run: |

          echo "=========================================="
          echo "Starting EC2 Deployment"
          echo "=========================================="

          echo "EC2 Instance:"
          echo "${{ env.EC2_INSTANCE_ID }}"

          echo "Docker Image:"
          echo "$IMAGE_URI"


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hospital Application" \
            --parameters 'commands=[
              "set -e",
              "echo Starting deployment",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 028282962975.dkr.ecr.ap-south-1.amazonaws.com",
              "echo Pulling Docker image",
              "docker pull '"$IMAGE_URI"'",
              "echo Stopping old container",
              "docker stop hospital-app || true",
              "echo Removing old container",
              "docker rm hospital-app || true",
              "echo Starting new container",
              "docker run -d --name hospital-app --restart unless-stopped -p 3000:3000 '"$IMAGE_URI"'",
              "echo Deployment completed",
              "docker ps --filter name=hospital-app"
            ]' \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID:"
          echo "$COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Wait for SSM command to complete
      # --------------------------------------------------------

      - name: Wait for EC2 Deployment

        run: |

          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          echo "SSM command completed"


      # --------------------------------------------------------
      # Verify SSM Deployment
      # --------------------------------------------------------

      - name: Verify EC2 Deployment

        run: |

          echo "Checking deployment status..."

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)


          echo "=========================================="
          echo "Deployment Status: $STATUS"
          echo "=========================================="


          if [ "$STATUS" != "Success" ]; then

            echo "Deployment failed"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}"

            exit 1

          fi


          echo "EC2 deployment successful"


      # --------------------------------------------------------
      # Verify Docker Container
      # --------------------------------------------------------

      - name: Verify Docker Container

        run: |

          echo "Checking Docker container..."


          VERIFY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Hospital Application" \
            --parameters 'commands=[
              "docker ps --filter name=hospital-app",
              "docker inspect -f \"{{.State.Status}}\" hospital-app"
            ]' \
            --query "Command.CommandId" \
            --output text)


          echo "Verification Command ID:"
          echo "$VERIFY_COMMAND_ID"


          aws ssm wait command-executed \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"


          aws ssm get-command-invocation \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"


      # --------------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------------

      - name: Deployment Complete

        run: |

          echo "=========================================="
          echo "Hospital Application Deployment Complete"
          echo "=========================================="
          echo ""
          echo "EC2 Instance:"
          echo "${{ env.EC2_INSTANCE_ID }}"
          echo ""
          echo "Container:"
          echo "${{ env.CONTAINER_NAME }}"
          echo ""
          echo "Application Port:"
          echo "${{ env.APP_PORT }}"
          echo ""
          echo "Docker Image:"
          echo "${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "Status: SUCCESS"
          echo "=========================================="


  # ==========================================================
  # JOB 4
  # FINAL PIPELINE SUMMARY
  # ==========================================================

  summary:

    name: CI/CD Pipeline Summary

    runs-on: ubuntu-latest

    needs:
      - ci
      - build-and-push
      - deploy

    if: always()

    steps:

      - name: Show Final Pipeline Status

        run: |

          echo "================================================"
          echo "       HOSPITAL CI/CD PIPELINE SUMMARY"
          echo "================================================"
          echo ""
          echo "CI Build:"
          echo "${{ needs.ci.result }}"
          echo ""
          echo "Docker Build + ECR + S3:"
          echo "${{ needs.build-and-push.result }}"
          echo ""
          echo "EC2 Deployment:"
          echo "${{ needs.deploy.result }}"
          echo ""
          echo "================================================"
          echo "              DEPLOYMENT FLOW"
          echo "================================================"
          echo ""
          echo "GitHub"
          echo "   ↓"
          echo "GitHub Actions"
          echo "   ↓"
          echo "npm CI + Build"
          echo "   ↓"
          echo "Docker Build"
          echo "   ↓"
          echo "Amazon ECR"
          echo "   ↓"
          echo "Amazon S3"
          echo "   ↓"
          echo "AWS Systems Manager"
          echo "   ↓"
          echo "Amazon EC2"
          echo "   ↓"
          echo "Docker Container"
          echo ""
          echo "================================================"

          if [ "${{ needs.ci.result }}" != "success" ] || \
             [ "${{ needs.build-and-push.result }}" != "success" ] || \
             [ "${{ needs.deploy.result }}" != "success" ]; then

            echo "PIPELINE FAILED"

            exit 1

          fi

          echo "PIPELINE COMPLETED SUCCESSFULLY"
